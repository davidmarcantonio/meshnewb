# Build MeshNewb, attest the exact files, deploy to GitHub Pages.
#
#   tag push (v*)       build that tag with the presets repo's current main
#   run manually        build the chosen ref with the presets repo's current main
#   daily schedule      if the presets repo's main has moved since the last deploy, rebuild the SAME app commit
#                       that is live now with the new presets, and redeploy. Otherwise do nothing.
#
# The presets repo is public and is read anonymously: no cross-repo token, no secret.
# Actions are pinned to commit SHAs so the pipeline itself is auditable.
name: Build and deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *" # daily, 11:23 UTC

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PRESETS_REPO: davidmarcantonio/meshtastic-us-presets
  SITE: https://mesh.marcantonio.me

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      app_ref: ${{ steps.plan.outputs.app_ref }}
      presets_commit: ${{ steps.plan.outputs.presets_commit }}
    steps:
      - id: plan
        run: |
          set -euo pipefail
          latest=$(git ls-remote "https://github.com/$PRESETS_REPO.git" refs/heads/main | cut -f1)
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read $PRESETS_REPO main"; exit 1; }
          echo "presets_commit=$latest" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "app_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Building $GITHUB_REF_NAME with presets $latest." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Daily check: compare with what is live. build.json is written by build.mjs at deploy time.
          live=$(curl -fsS --retry 3 "$SITE/build.json")
          app=$(jq -r '.commit // empty' <<<"$live")
          deployed=$(jq -r '.presets.commit // empty' <<<"$live")
          if [ -z "$deployed" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "The live site predates presets support. Deploy a tagged release first; the daily check starts after that." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$deployed" = "$latest" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Presets unchanged ($latest). Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$app" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::live build.json has no app commit"; exit 1; }
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "app_ref=$app" >> "$GITHUB_OUTPUT"
            echo "Presets moved $deployed -> $latest. Rebuilding app commit $app." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.app_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (presets pinned to the commit the plan job saw)
        env:
          PRESETS_COMMIT: ${{ needs.plan.outputs.presets_commit }}
        run: npm run build
      - name: Show hashes
        run: cat dist/build.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          # build.json names the presets commit and the sha256 of every preset file.
          subject-path: |
            dist/index.html
            dist/radio/index.html
            dist/join/index.html
            dist/family/index.html
            dist/check/index.html
            dist/app.js
            dist/app.css
            dist/og.png
            dist/favicon.ico
            dist/favicon.svg
            dist/apple-touch-icon.png
            dist/build.json
            dist/presets/index.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
